[project]
name = "fortigate-fastmcp-server"
version = "0.1.0"
description = "FastMCP server exposing FortiGate traffic-log and session troubleshooting tools over the FortiOS REST API."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
fortigate-mcp = "fortigate_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fortigate_mcp"]
